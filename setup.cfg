[mypy]
files=schedule
ignore_missing_imports = True

[flake8]
exclude =
    .git,
    __pycache__,
    test,
    build,
    dist

max-line-length = 88
max-complexity = 25
addons = file,open,basestring,xrange,unicode,long,cmp

[tool:pytest]
addopts = --capture=no --color=yes

[coverage:run]
branch = True
source = schedule

omit =
    .tox/*
    setup.py
    test_schedule.py

plugins =
    coverage_python_version

[coverage:report]
show_missing = True
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    raise AssertionError

ignore_errors = True

[html]
directory = coverage
