# To install the git pre-commit hook run:
#   pre-commit install
# To update the pre-commit hooks run:
#   pre-commit install-hooks
repos:
  - repo: meta
    hooks:
      - id: check-useless-excludes
      - id: check-hooks-apply
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.0.1
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      #- id: check-toml
      - id: check-json
      - id: check-yaml

  - repo: "https://github.com/psf/black"
    rev: "21.9b0"
    hooks:
      - id: "black"
        exclude: '(^docs/.*|^setup.py$)'
        language_version: python3
        name: "Format code (black)"

  - repo: "https://github.com/asottile/blacken-docs"
    rev: "v1.11.0"
    hooks:
      - id: "blacken-docs"
        name: "Format docs (blacken-docs)"
        args: ["-l", "64"]
        additional_dependencies:
          - "black==21.9b0"

  - repo: https://github.com/PyCQA/doc8
    rev: 0.9.1
    hooks:
      - id: doc8
        args:
          - '--max-line-length=90'
          - '--ignore=D001'

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.9.0
    hooks:
      - id: rst-backticks
        # exclude: ChangeLog\.rst$
      - id: rst-directive-colons
      - id: rst-inline-touching-normal

  - repo: https://github.com/myint/autoflake
    rev: v1.4
    hooks:
      - id: autoflake
        args:
          - --in-place
          - --remove-all-unused-imports
          - --remove-duplicate-keys
          - --remove-unused-variables

  - repo: https://gitlab.com/pycqa/flake8
    rev: 3.9.2
    hooks:
      - id: flake8
        exclude: '(^docs/.*)'
        additional_dependencies: ["flake8-bugbear"]

  -   repo: https://github.com/pre-commit/mirrors-mypy
      rev: 'v0.910-1'
      hooks:
      - id: mypy
        exclude: '(^docs/.*|^test_.*.py$)'
        additional_dependencies: [tokenize-rt==3.2.0]
        args: [--no-strict-optional, --ignore-missing-imports]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.0
    hooks:
      - id: bandit
        exclude: 'test_schedule.py'
        args: ["-b", "bandit_baseline.json"]

  - repo: https://github.com/PyCQA/pylint
    rev: v2.11.1
    hooks:
      - id: pylint
        exclude: '(^docs/.*|^setup.py$|^test_.*.py$)'
        args:
          [
            "-rn",
            "--suggestion-mode=y",
            "--fail-under=8.75",
          ]

ci:
    autofix_commit_msg: |
        [pre-commit.ci] auto fixes from pre-commit.com hooks

        for more information, see https://pre-commit.ci
    autofix_prs: false
    autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
    autoupdate_schedule: weekly
    skip: []
    submodules: false

# re-running a pull request: you can trigger a re-run on a pull request by
#    commenting pre-commit.ci run (must appear on a line by itself).
# skipping push runs: skip a run by putting [skip ci], [ci skip],
#    [skip pre-commit.ci], or [pre-commit.ci skip] in the commit message.
