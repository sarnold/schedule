[tox]
envlist = py3{6,7,8,9}-test-{linux,macos,windows}
skip_missing_interpreters = true
skipsdist = True

[gh-actions]
python =
    3.6: py36
    3.7: py37
    3.8: py38
    3.9: py39

[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    macos-latest: macos
    windows-latest: windows

[testenv]

skip_install = true

passenv =
    pythonLocation
    CI
    OS
    PYTHONIOENCODING
    PIP_DOWNLOAD_CACHE
    VERBOSE
    SSH_AUTH_SOCK

# pre-commit may also need `http_proxy https_proxy no_proxy` in passenv
# if run behind fw and proxy is required

deps =
    pip>=20.0.1
    pre: pre-commit
    build: setuptools
    build: build
    build: twine
    {diff,black,format}: black
    lint: pylint
    style: flake8
    sec: bandit
    {docs,setup}: docutils
    {docs,setup}: Pygments
    {docs,setup}: Sphinx

changedir =
    docs: docs

commands_pre =
    {test}: python -m pip install -U pip
    {test}: python -m pip install -r requirements-dev.txt

commands =
    diff: black -v --diff .
    black: black -v --check .
    format: black -v .
    build: python -m build .
    build: twine check dist/*
    test: py.test test_schedule.py schedule -v --cov schedule --cov-report term-missing
    test: python -m mypy -p schedule
    test: coverage xml
    setup: python setup.py check --strict --metadata --restructuredtext
    lint: python -m pylint --fail-under=8.75 schedule/
    sec: bandit -r schedule/
    style: flake8 schedule/
    pre: pre-commit run --all-files --show-diff-on-failure
    docs: sphinx-build -W -b html -d {envtmpdir}/doctrees . {envtmpdir}/html
