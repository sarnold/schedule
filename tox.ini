[tox]
envlist = py3{6,7,8,9}-{linux,macos,windows}
skip_missing_interpreters = true


[gh-actions]
python =
    3.6: py36
    3.7: py37
    3.8: py38
    3.9: py39

[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    macos-latest: macos
    windows-latest: windows

[base]
passenv = CI PYTHON PYTHONIOENCODING
deps = -rrequirements-dev.txt

[testenv]
passenv = {[base]passenv}
deps = {[base]deps}
commands =
    py.test test_schedule.py schedule -v --cov schedule --cov-report term-missing
    python -m mypy -p schedule

[testenv:docs]
passenv = {[base]passenv}
changedir = docs
deps = {[base]deps}
commands = sphinx-build -W -b html -d {envtmpdir}/doctrees . {envtmpdir}/html

[testenv:format]
passenv = {[base]passenv}
deps = black
commands = black --diff .

[testenv:setuppy]
passenv = {[base]passenv}
deps = {[base]deps}
commands =
    python setup.py check --strict --metadata --restructuredtext

[testenv:deploy]
passenv =
    {[base]passenv}
    pythonLocation
    PYTHONPATH
    GITHUB_WORKSPACE

deps =
    pip>=19.0.1

commands_pre =
    python -m pip install --upgrade pip wheel setuptools twine build

commands =
    python -m build -s
    python -m build
    twine check dist/*
